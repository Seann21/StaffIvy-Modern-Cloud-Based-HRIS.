<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="staffivy-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#557DFF" />
      <stop offset="100%" stop-color="#244DD4" />
    </linearGradient>
    <linearGradient id="staffivy-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base with Shadow -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#staffivy-grad)" filter="url(#shadow)" />
  
  <!-- Subtle Top Highlight / Glossy Border -->
  <rect x="3.5" y="3.5" width="57" height="57" rx="15.5" fill="none" stroke="url(#staffivy-glow)" stroke-width="1.5" />

  <!-- StaffIvy Leaf Brand Mark -->
  <g transform="translate(14, 14) scale(1.5)" fill="none" stroke="#FFFFFF" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z" />
    <path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12" />
  </g>
</svg>

